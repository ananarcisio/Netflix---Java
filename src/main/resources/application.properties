server.port=8081
spring.application.name=netflix

# Configurações do Banco de Dados H2
spring.datasource.url=jdbc:h2:mem:netflixdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o console do H2 em http://localhost:8081/h2-console
spring.h2.console.enabled=true

# Garante que o Hibernate crie as tabelas antes de rodar o arquivo data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update