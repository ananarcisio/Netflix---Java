spring.application.name=netflix

# Configurações do Banco de Dados H2
spring.datasource.url=jdbc:h2:mem:netflixdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita o console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Garante que o Hibernate crie as tabelas antes de rodar o arquivo data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update